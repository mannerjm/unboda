name: Social Launch Expansion Patch

on:
  push:
    branches:
      - feature/social-launch-expansion

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/social-launch-expansion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply social launch expansion
        run: python scripts/apply-social-launch-expansion.py

      - name: Check patch formatting
        run: git diff --check

      - name: Show remaining current launch-count references
        run: |
          grep -RInE '54 (launch|Launch)|54-product|47 topic|47 Topic|TOPIC 47|length ?[!=]==? ?54|length ?[!=]==? ?47' app scripts package.json || true

      - name: Validate social launch contracts
        run: |
          npx tsx scripts/social-launch-expansion-regression.ts
          npx tsx scripts/premium-presentation-regression.ts
          npx tsx scripts/paid-analysis-v4-topic-config-regression.ts
          npx tsx scripts/analysis-edition-policy-key-regression.ts
          npx tsx scripts/launch-v1-pricing-mapping-regression.ts
          npx tsx scripts/paid-generation-telemetry-regression.ts
          npx tsx scripts/topic-purchase-decision-regression.ts
          npx tsx scripts/ai-consulting-scope-regression.ts
          npx tsx scripts/paid-analysis-v4-period-family-regression.ts
          npx tsx scripts/paid-analysis-v4-premium-depth-regression.ts
          npm run test:v4-launch-audit
          npm run test:v4-price-tier-audit

      - name: Build production bundle
        run: npm run build

      - name: Commit validated expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app scripts package.json docs
          git commit -m 'Activate social support conflict and network analyses'
          git push origin HEAD:feature/social-launch-expansion
