name: Launch Security Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "app/**"
      - "scripts/launch-security-*.ts"
      - ".github/workflows/launch-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report full dependency audit
        continue-on-error: true
        run: npm audit --audit-level=moderate
