<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">사주의 네 기둥을 읽는 방법</title>
<desc id="d">연주, 월주, 일주, 시주를 네 개의 독립적인 카드로 시각화한 운보다 자체 제작 일러스트</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f2ff"/><stop offset="1" stop-color="#eee4ff"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f1ff"/></linearGradient>
  <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#6a44a3" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1080" cy="60" r="200" fill="#d8c4ff" opacity=".32"/>
<circle cx="90" cy="600" r="260" fill="#e1ccf8" opacity=".36"/>
<text x="96" y="104" font-size="21" letter-spacing="2" font-weight="700" fill="#7a50c3" font-family="sans-serif">운보다 · 사주 입문 가이드</text>
<text x="94" y="172" font-size="50" font-weight="800" fill="#342046" font-family="sans-serif">사주의 네 기둥, 어렵지 않게</text>
<text x="96" y="215" font-size="23" fill="#695479" font-family="sans-serif">태어난 해 · 달 · 날 · 시간을 하나씩 알아보세요</text>
<g filter="url(#shadow)">
 <rect x="85" y="263" width="235" height="240" rx="27" fill="url(#card)" stroke="#e5d6f8" stroke-width="2"/>
 <rect x="350" y="263" width="235" height="240" rx="27" fill="url(#card)" stroke="#e5d6f8" stroke-width="2"/>
 <rect x="615" y="263" width="235" height="240" rx="27" fill="url(#card)" stroke="#e5d6f8" stroke-width="2"/>
 <rect x="880" y="263" width="235" height="240" rx="27" fill="url(#card)" stroke="#e5d6f8" stroke-width="2"/>
</g>
<g font-family="sans-serif" text-anchor="middle">
 <rect x="167" y="299" width="72" height="72" rx="20" fill="#ddcaf9"/>
 <circle cx="203" cy="335" r="18" stroke="#7955b9" stroke-width="4" fill="none"/>
 <path d="M203 317v36M185 335h36" stroke="#7955b9" stroke-width="3" stroke-linecap="round"/>
 <text x="203" y="413" font-size="33" font-weight="800" fill="#44295e">연주</text>
 <text x="203" y="457" font-size="21" fill="#695479">태어난 해</text>
 <rect x="432" y="299" width="72" height="72" rx="20" fill="#eadcf7"/>
 <path d="M452 346a26 26 0 1 1 28 2M469 319v18l12 7" fill="none" stroke="#8051a5" stroke-width="4" stroke-linecap="round"/>
 <text x="468" y="413" font-size="33" font-weight="800" fill="#44295e">월주</text>
 <text x="468" y="457" font-size="21" fill="#695479">태어난 달</text>
 <rect x="697" y="299" width="72" height="72" rx="20" fill="#f2d9e9"/>
 <circle cx="733" cy="335" r="19" fill="none" stroke="#b56a95" stroke-width="4"/>
 <circle cx="733" cy="335" r="7" fill="#b56a95"/>
 <text x="733" y="413" font-size="33" font-weight="800" fill="#44295e">일주</text>
 <text x="733" y="457" font-size="21" fill="#695479">태어난 날</text>
 <rect x="962" y="299" width="72" height="72" rx="20" fill="#e2e9fa"/>
 <circle cx="998" cy="335" r="22" fill="none" stroke="#617cc0" stroke-width="4"/>
 <path d="M998 320v16l11 8" stroke="#617cc0" stroke-width="4" fill="none" stroke-linecap="round"/>
 <text x="998" y="413" font-size="33" font-weight="800" fill="#44295e">시주</text>
 <text x="998" y="457" font-size="21" fill="#695479">태어난 시간</text>
</g>
<path d="M84 547H1115" stroke="#cbb5e6" stroke-width="2"/>
<text x="96" y="587" font-size="19" fill="#705883" font-family="sans-serif">입력한 출생 정보를 먼저 확인한 뒤, 전통 명리의 설명을 차분히 읽어보세요.</text>
</svg>