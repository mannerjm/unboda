name: UNBODA licensed real-photo candidate intake (NO SOCIAL POST)
# Candidate photos are NEVER publication-approved by this workflow.
on:
  schedule:
    - cron: '25 11,13 * * *' # 20:25/22:25 KST, retry with same no-publication gates
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/social/commons-photo-candidates.py'
      - 'scripts/social/vision-review-lifestyle-photo.py'
      - 'scripts/social/lifestyle-photo-scenes.json'
      - 'scripts/social/lifestyle-photo-first-editorial.mjs'
      - 'scripts/social/lifestyle-photo-first-editorial.test.mjs'
      - '.github/workflows/unboda-lifestyle-photo-candidates.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/social/commons-photo-candidates.py'
      - 'scripts/social/vision-review-lifestyle-photo.py'
      - 'scripts/social/lifestyle-photo-scenes.json'
      - 'scripts/social/lifestyle-photo-first-editorial.mjs'
      - 'scripts/social/lifestyle-photo-first-editorial.test.mjs'
      - '.github/workflows/unboda-lifestyle-photo-candidates.yml'
permissions:
  contents: read
concurrency:
  group: unboda-lifestyle-photo-candidates
  cancel-in-progress: false
jobs:
  offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --no-cache-dir Pillow==11.3.0
      - name: Verify 90-day no-repeat article template and photo-to-copy exact scene
        run: node --test scripts/social/lifestyle-photo-first-editorial.test.mjs
      - name: Check rights, image type, image size and perceptual duplicate logic
        run: python scripts/social/commons-photo-candidates.py --self-test
      - name: Verify that image model checks cannot authorize publication
        run: python scripts/social/vision-review-lifestyle-photo.py --self-test
  candidate-intake:
    if: github.repository == 'mannerjm/unboda' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: offline-gates
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: main-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: test/social-automation-safety-poc-20261023
          path: source-briefs
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir Pillow==11.3.0
      - name: Download next-day photo candidates with provenance; never publish
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Asia/Seoul date -d tomorrow +%Y-%m-%d)"
          STAMP="$(echo "$DAY" | tr -d '-')"
          test -f "source-briefs/automation/social/lifestyle-pilot/daily-images/$STAMP.json"
          python main-source/scripts/social/commons-photo-candidates.py \
            --brief "source-briefs/automation/social/lifestyle-pilot/daily-images/$STAMP.json" \
            --date "$DAY" --output photo-candidates
          python - <<'PY'
          import json
          m=json.load(open("photo-candidates/candidate-manifest.json"))
          assert 0 <= len(m["photos"]) <= 56
          assert {p["hourKst"] for p in m["photos"]}.issubset({"01","04","10","13","16","19","22"})
          assert m["distinctHourSlots"] == len({p["hourKst"] for p in m["photos"]})
          assert m["collectionComplete"] is (m["distinctHourSlots"] == 7)
          print("PHOTO_CANDIDATES_PER_SLOT",[sum(p["hourKst"] == h for p in m["photos"])
            for h in ("01","04","10","13","16","19","22")])
          print("MISSING_LICENSED_SCENES",m["missingSlots"])
          assert m["photoReadyForSnsPosting"] is False
          assert m["publicationAllowed"] is False
          assert m["actualVisualSceneInspected"] is False
          assert all(not x["imageVisuallyInspected"] for x in m["photos"])
          print("SEVEN_CANDIDATE_PHOTOS_NOT_SOCIAL_POSTABLE")
          PY
      - name: Cache fixed-version zero-shot vision model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: unboda-offline-clip-vit-base-patch32-aba0d299-qa-only
      - name: Install pinned CPU-only local scene inspection model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==4.45.2 safetensors==0.4.5
      - name: Review actual pixels before they can become future approved media
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
        shell: bash
        run: |
          set -euo pipefail
          python main-source/scripts/social/vision-review-lifestyle-photo.py \
            --manifest photo-candidates/candidate-manifest.json \
            --output photo-candidates/vision-review.json
          python - <<'PY'
          import json
          x=json.load(open('photo-candidates/vision-review.json'))
          assert x['photoReviewCount']==7
          assert 0 <= x['photoCandidatesScored'] <= 56
          assert x['publicationAllowed'] is False
          assert x['photoReadyForSnsPosting'] is False
          assert x['wholeSocial90DayCoverageVerified'] is False
          print('CLIP_SCENE_REVIEW_DONE_BUT_SOCIAL_PUBLISHING_REMAINS_BLOCKED')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write honest photo-driven stories from checked visual scenes
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Asia/Seoul date -d tomorrow +%Y-%m-%d)"
          STAMP="$(echo "$DAY" | tr -d '-')"
          node main-source/scripts/social/lifestyle-photo-first-editorial.mjs \
            --date="$DAY" \
            --editorial="source-briefs/automation/social/lifestyle-pilot/daily-images/$STAMP.json" \
            --manifest="photo-candidates/candidate-manifest.json" \
            --review="photo-candidates/vision-review.json" \
            --catalog="main-source/automation/social/saleable-product-catalog.json" \
            --output="photo-candidates/photo-first-editorial.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('photo-candidates/photo-first-editorial.json'));
          if(r.publicationAllowed!==false||r.photoReadyForSnsPosting!==false||
             r.snsRequestsAttempted!==0)throw Error('UNSAFE_PHOTO_FIRST_PUBLICATION_OVERRIDE');
          console.log('PHOTO_FIRST_EDITORIAL_DRAFT_ONLY',r.generatedPhotoAnchoredStories,'OF 7');
          NODE
      - name: Store licensed candidates privately for automated visual QA development
        uses: actions/upload-artifact@v4
        with:
          name: unboda-photo-candidates-UNAPPROVED
          path: photo-candidates/
          if-no-files-found: error
          retention-days: 3
      - name: Report incomplete photographs as a failed readiness gate for alerts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          m=json.load(open("photo-candidates/candidate-manifest.json"))
          r=json.load(open("photo-candidates/vision-review.json"))
          if m.get("photoReadyForSnsPosting") is not False or r.get("publicationAllowed") is not False:
           raise SystemExit("UNSAFE_PHOTO_PUBLISHING_FLAG")
          if not m["collectionComplete"] or not r["allAutomatedSceneMatches"]:
           print("LIFESTYLE_SEVEN_PHOTO_QA_INCOMPLETE")
           print("missingSlots",r["missingLicensedPhotoSlots"])
           print("passed",r["automatedSceneMatchCount"],"of 7")
           raise SystemExit(1)
          print("PHOTO_SCENE_QA_SEVEN_OF_SEVEN_CANDIDATES_NOT_SOCIAL_PUBLISHED")
          PY
