name: UNBODA ONE-TIME Oct30 corrected 07 carousel media
on:
  push:
    paths:
      - '.github/workflows/unboda-zodiac-20261030-image-correction.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unboda-zodiac-20261030-clean-v2
  cancel-in-progress: false
jobs:
  generate-corrected-social-images:
    if: github.repository == 'mannerjm/unboda' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prevent late publishing and avoid overwriting existing release
        run: |
          set -euo pipefail
          NOW="$(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S')"
          if [[ "$NOW" > "2026-10-30T06:30:00" ]]; then
            echo "LATE_TO_REPLACE_ALREADY_SCHEDULED_07_ZODIAC_POST" >&2
            exit 1
          fi
          if gh release view unboda-zodiac-20261030-clean-v2 --repo mannerjm/unboda >/dev/null 2>&1; then
            echo "CORRECTED_RELEASE_ALREADY_EXISTS_NO_REUPLOAD" >&2
            exit 1
          fi
      - name: Install original owned image renderer and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          python -m pip install --no-cache-dir 'Pillow==11.3.0' 'korean-lunar-calendar==0.3.1'
      - name: Render same Oct30 60 years, with only two requested visible text removals
        run: |
          python scripts/daily-zodiac/render.py --date 2026-10-30 --out release-zodiac
      - name: Verify seven full images, 60 ganji, clean cover and clean zodiac headers
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          root=pathlib.Path('release-zodiac')
          m=json.loads((root/'zodiac-manifest.json').read_text(encoding='utf-8'))
          assert m['dateKst']=='2026-10-30'
          assert m['dayGanji']=='정축'
          assert m['logicVersion']=='birth-year-sexagenary-60-v2'
          assert m['birthYearCount']==60
          assert len(m['images'])==7 and len(m['animals'])==12
          years=[x for a in m['animals'] for x in a['birthYears']]
          assert len(years)==60 and {x['year'] for x in years}==set(range(1960,2020))
          assert len({x['ganji'] for x in years})==60
          assert len({x['advice'] for x in years})==60
          assert len({a['sha256'] for a in m['images']})==7
          for a in m['images']:
            data=(root/a['name']).read_bytes()
            assert hashlib.sha256(data).hexdigest()==a['sha256']
            assert 20000<len(data)<7000000
            with Image.open(root/a['name']) as im:
              assert im.size==(1080,1350)
          src=pathlib.Path('scripts/daily-zodiac/render.py').read_text(encoding='utf-8')
          assert 'label(d,(108,1161),"입춘 전후 출생자는 연주 확인 필요"' not in src
          assert 'label(d,(480,top+42),"오늘의 지지 관계: "' not in src
          with Image.open(root/'unboda-2026-10-30-01.png') as im:
            assert len({im.getpixel((x,1172)) for x in range(110,650,9)})==1,\
              "COVER_UNWANTED_SMALL_LABEL_STILL_VISIBLE"
          for k in range(2,8):
            with Image.open(root/f'unboda-2026-10-30-{k:02d}.png') as im:
              for yy in (232,752):
                assert len({im.getpixel((x,yy)) for x in range(490,900,7)})==1,\
                  "ZODIAC_RELATION_HEADER_STILL_VISIBLE"
          print('VERIFIED_SEVEN_REAL_CORRECTED_07_CAROUSEL_PNG_NO_UNWANTED_LABELS')
          PY
      - name: Host replacement images under new immutable date-specific release
        run: |
          set -euo pipefail
          gh release create unboda-zodiac-20261030-clean-v2 release-zodiac/* \
            --repo mannerjm/unboda \
            --target "${{ github.sha }}" \
            --title "UNBODA corrected Oct30 seven-card social images (no two labels)" \
            --notes "Owner requested removal of only two printed lines. Same 2026-10-30 day ganji, 60 birth years, advice, 7 pages, first-party graphics. The actual scheduled Metricool post must be updated separately; creating this release does not publish it." \
            --prerelease
          gh release view unboda-zodiac-20261030-clean-v2 --repo mannerjm/unboda --json assets --jq '.assets|length' | grep -qx 9
          echo "CORRECTED_SEVEN_IMAGE_SOURCE_IS_READY_FOR_EXISTING_METRICOOL_POST"
