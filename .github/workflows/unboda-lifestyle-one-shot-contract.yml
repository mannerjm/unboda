name: UNBODA one-shot lifestyle scheduler contract
# NO provider credentials; pure injected-adapter tests only.
on:
  pull_request:
    paths:
      - "scripts/social/lifestyle-one-shot-scheduler.mjs"
      - "scripts/social/lifestyle-one-shot-scheduler.test.mjs"
      - "scripts/social/lifestyle-supabase-claim-store.mjs"
      - "scripts/social/lifestyle-supabase-claim-store.test.mjs"
      - "scripts/social/lifestyle-metricool-api-adapter.mjs"
      - "scripts/social/lifestyle-metricool-api-adapter.test.mjs"
      - ".github/workflows/unboda-lifestyle-one-shot-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/social/lifestyle-one-shot-scheduler.mjs"
      - "scripts/social/lifestyle-one-shot-scheduler.test.mjs"
      - "scripts/social/lifestyle-supabase-claim-store.mjs"
      - "scripts/social/lifestyle-supabase-claim-store.test.mjs"
      - "scripts/social/lifestyle-metricool-api-adapter.mjs"
      - "scripts/social/lifestyle-metricool-api-adapter.test.mjs"
      - ".github/workflows/unboda-lifestyle-one-shot-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          set -euo pipefail
          node --check scripts/social/lifestyle-one-shot-scheduler.mjs
          node --test scripts/social/lifestyle-one-shot-scheduler.test.mjs
          node --test scripts/social/lifestyle-supabase-claim-store.test.mjs
          node --test scripts/social/lifestyle-metricool-api-adapter.test.mjs
          echo "ONE_SHOT_CONTRACT_PASSED_NO_EXTERNAL_PROVIDER_WRITE"
