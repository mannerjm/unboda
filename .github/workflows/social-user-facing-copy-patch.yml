name: Social User Facing Copy Patch

on:
  push:
    branches:
      - fix/social-launch-metadata-scope

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/social-launch-metadata-scope
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply copy patch
        run: python scripts/apply-social-user-facing-copy.py

      - name: Check diff
        run: git diff --check

      - name: Validate social copy and launch contracts
        run: |
          npx tsx scripts/social-launch-expansion-regression.ts
          npx tsx scripts/paid-analysis-v4-topic-config-regression.ts
          npx tsx scripts/premium-presentation-regression.ts
          npm run build

      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/paidAnalysisTopicConfig.ts app/lib/analysisTopics.ts scripts/social-launch-expansion-regression.ts
          git commit -m 'Focus social copy on interpersonal topics'
          git push origin HEAD:fix/social-launch-metadata-scope
