name: UNBODA temporary local editorial inference smoke
on:
  push:
    branches:
      - feature/magazine-local-ai-draft-factory-20261029
    paths:
      - '.github/workflows/unboda-magazine-smoke-20261029.yml'
      - 'scripts/magazine-local-draft.mjs'
permissions:
  contents: read
jobs:
  offline-inference:
    if: github.repository == 'mannerjm/unboda'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Prepare regression and model source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/magazine-local-draft.mjs --self-test
          git clone -q --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout -q 0ac1a7fd35c127a18c0cbc6c57d12e256a6a385b
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-server -j 3
      - name: Download official SHA-verified offline model
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 700 \
            'https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/90862c4b9d2787eaed51d12237eafdfe7c5f6077/Qwen3-1.7B-Q8_0.gguf' \
            --output "$RUNNER_TEMP/unboda-qwen.gguf"
          echo "061b54daade076b5d3362dac252678d17da8c68f07560be70818cace6590cb1a  $RUNNER_TEMP/unboda-qwen.gguf" | sha256sum --check
      - name: Produce and validate one unapproved Korean article
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/llama.cpp/build/bin/llama-server" -m "$RUNNER_TEMP/unboda-qwen.gguf" \
            --alias unboda-editorial --host 127.0.0.1 --port 8080 --ctx-size 8192 --threads 4 \
            > "$RUNNER_TEMP/inference.log" 2>&1 &
          ready=false
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then tail -80 "$RUNNER_TEMP/inference.log"; exit 1; fi
          node scripts/magazine-local-draft.mjs --generate
          node scripts/magazine-local-draft.mjs --apply
          npm run test:magazine-seo
          git diff --check
          echo "UNBODA_LOCAL_AI_DRAFT_SMOKE_PASS: one unpublished candidate, zero external paid API calls"
