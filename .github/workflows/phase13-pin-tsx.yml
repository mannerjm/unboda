name: Phase 13 Pin TSX

on:
  push:
    branches:
      - "launch/phase13-security-hardening"
    paths:
      - ".github/workflows/phase13-pin-tsx.yml"

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: launch/phase13-security-hardening

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin tsx regression runner
        run: npm install --save-dev --save-exact tsx@4.23.13

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Commit dependency lock refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Pin tsx regression runner"
          git push origin HEAD:launch/phase13-security-hardening
