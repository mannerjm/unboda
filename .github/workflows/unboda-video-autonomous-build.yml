# Ubuntu-latest currently resolves to 26.04 and apt-get update silently
# stalled >240s in a video-render job. Pin the tested LTS runner, and skip
# network-wide apt metadata refresh when tools/fonts already exist.
# Upstream Noto CJK fonts are fetched only if absent and verified against
# exact upstream Git blobs to avoid broken apt mirrors; fonts never ship in MP4 release.
name: UNBODA 4 daily Korean shorts build, independent ASR QA and publishable release
# A small standalone main-branch workflow can run independently of the unmerged
# video-development PR; GitHub Actions sources are pinned to a single commit.
# It DOES NOT create Metricool posts or change any social publishing switch.
# Full rebuild after a test-branch visual-regression correction must re-pin source_sha.
# Failed-job reruns alone reuse the earlier preflight SHA and cannot apply that fix.
on:
  schedule:
    - cron: '13 8 * * *' # 17:13 KST, primary next-day render
    - cron: '13 9 * * *' # 18:13 KST, immutable-release guarded backup
    - cron: '13 11 * * *' # 20:13 KST, final backup before 23:45 KST worker
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unboda-video-autonomous-build.yml'
permissions:
  contents: write
concurrency:
  # Scheduled backups remain serialized. A new code-fix push may proceed on
  # its own recovery lane instead of waiting behind an unhealthy scheduled run.
  # Both lanes still check the same immutable date-tagged release; never POST.
  group: unboda-daily-video-media-${{ github.ref }}-${{ github.event_name == 'push' && 'code-repair' || github.event_name == 'workflow_dispatch' && 'one-shot-recovery' || 'scheduled' }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'mannerjm/unboda' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      target_date: ${{ steps.check.outputs.target_date }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      skip_release: ${{ steps.check.outputs.skip_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/social-automation-safety-poc-20261023
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: check
        env:
          TZ: Asia/Seoul
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          DATE="$(date -d tomorrow +%Y%m%d)"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "target_date=$DATE" >> "$GITHUB_OUTPUT"
          TAG="unboda-saju-shorts-$DATE"
          if gh release view "$TAG" --repo mannerjm/unboda >/dev/null 2>&1; then
            COUNT="$(gh release view "$TAG" --repo mannerjm/unboda --json assets --jq '.assets | length')"
            test "$COUNT" -eq 10 || { echo "EXISTING_VIDEO_RELEASE_INCOMPLETE: $TAG assets=$COUNT" >&2; exit 1; }
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "ALREADY_HOSTED_DATE_RELEASE_NO_DUPLICATE_BUILD: $TAG"
            # Once a 10-asset release is immutable, don't test the advancing
            # staging storyboard against the *already released* date.
            # The separate product-content QA verifies new source at each change.
            exit 0
          fi
          echo "skip_release=false" >> "$GITHUB_OUTPUT"
          node --test automation/social/lifestyle-pilot/brand-video-guard.test.mjs
          node --test automation/social/lifestyle-pilot/topic-visual-guard.test.mjs
          node --test automation/social/lifestyle-pilot/four-daily-private-validator.test.mjs
          node automation/social/lifestyle-pilot/four-daily-private-validator.mjs
          # The staging source must advertise a REAL currently saleable report.
          node scripts/social-saleable-product-guard.mjs --video \
            automation/social/lifestyle-pilot/episodes/003-midnight.json \
            automation/social/lifestyle-pilot/episodes/004-commute.json \
            automation/social/lifestyle-pilot/episodes/005-friendship.json \
            automation/social/lifestyle-pilot/episodes/002-afterwork.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=process.env.TZ?new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()):'';
          const tomorrow=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
          tomorrow.setDate(tomorrow.getDate()+1);
          const expected=[tomorrow.getFullYear(),String(tomorrow.getMonth()+1).padStart(2,'0'),
            String(tomorrow.getDate()).padStart(2,'0')].join('');
          const files=['003-midnight','004-commute','005-friendship','002-afterwork'];
          const seen=new Set();
          for(const file of files){
           const p='automation/social/lifestyle-pilot/episodes/'+file+'.json';
           const x=JSON.parse(fs.readFileSync(p,'utf8'));
           if(!x.topicKey?.endsWith(expected)||
              x.automatedPublicationAllowed!==false||seen.has(x.topicKey)||
              typeof x.narrationDraft?.[2]!=='string'||
              x.narrationDraft?.some(line=>typeof line!=='string'||line.replace(/\s/g,'').length>32)||
              x.narrationDraft[2].replace(/\s/g,'').length<28||
              // A short second/fourth spoken scene produced >4s silent spans on 2026-11-02.
              // AVOID_4S_VOICE_GAPS: fail early before TTS; final waveform QA still decides.
              [1,3].some(i=>typeof x.narrationDraft?.[i]!=='string'||
                x.narrationDraft[i].replace(/\s/g,'').length<26)||
              !['https://unboda.kr','https://unboda.kr/guest-saju'].includes(x.destination)||
              !x.narrationDraft?.[3]?.includes('운보다 무료 사주 조회'))
             throw Error('NO_FRESH_NEXT_DAY_STORYBOARD:'+file);
           seen.add(x.topicKey);
          }
          console.log('NEXT_DAY_PRIVATE_SOURCE_VERIFIED '+expected+' topics='+seen.size);
          NODE
      # Regression safety: verify the Python renderer against the same pinned
      # brief BEFORE the costly speech model download and four video renders.
      # A saju-first editorial-format mismatch previously failed only in render.
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip_release != 'true'
        with:
          python-version: '3.10'
      - name: Python video-render contracts before costly MP4 processing
        if: steps.check.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          # Use exact upstream Noto CJK fonts verified by Git blob hash.
          # The font is used on ephemeral runners only; it is NOT a release asset.
          if test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc &&
             test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc; then
            echo "EXACT_KOREAN_CJK_FONTS_PRESENT"
          else
            tmp="$(mktemp -d)"
            rev="f8d157532fbfaeda587e826d4cd5b21a49186f7c"
            for item in \
              NotoSansCJK-Regular.ttc:a2033d0e4e53f568c3f418a7d5d8c951af3f76c1 \
              NotoSansCJK-Bold.ttc:ce48b99a84eb3300774353f1f15ce686e53b6734; do
              font="$(printf '%s' "$item" | cut -d: -f1)"
              digest="$(printf '%s' "$item" | cut -d: -f2)"
              curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --connect-timeout 10 --max-time 150 \
                "https://raw.githubusercontent.com/notofonts/noto-cjk/$rev/Sans/OTC/$font" \
                --output "$tmp/$font"
              test "$(git hash-object "$tmp/$font")" = "$digest" || {
                echo "PINNED_CJK_FONT_INTEGRITY_CHECK_FAILED:$font" >&2
                exit 1
              }
              sudo install -D -m 0644 "$tmp/$font" "/usr/share/fonts/opentype/noto/$font"
            done
            echo "PINNED_KOREAN_CJK_FONTS_VERIFIED_FROM_UPSTREAM"
          fi
          timeout 150s python -m pip install --disable-pip-version-check --quiet 'Pillow==11.3.0'
          python -m unittest discover -s automation/social/lifestyle-pilot -p 'test_*.py' -v
  voice-model:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.skip_release != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Restore official Korean model files from Actions cache
        id: cached-kr
        uses: actions/cache@v4
        with:
          path: /tmp/unboda-kr-voice-model
          key: unboda-original-melotts-kr-s3-20261029-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Hugging Face HTTP downloader (Xet explicitly disabled)
        run: python -m pip install --no-cache-dir 'huggingface_hub==0.36.2'
      - name: Download Korean original MeloTTS checkpoint once over HTTP, not Xet
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '180'
          HF_HUB_ETAG_TIMEOUT: '30'
        run: |
          set -euo pipefail
          mkdir -p /tmp/unboda-kr-voice-model
          python - <<'PY'
          import hashlib,json,pathlib,random,shutil,time
          from huggingface_hub import hf_hub_download
          root=pathlib.Path('/tmp/unboda-kr-voice-model')
          repo='myshell-ai/MeloTTS-Korean'
          revision='0207e5adfc90129a51b6b03d89be6d84360ed323'
          for name in ('config.json','checkpoint.pth'):
            target=root/name
            if target.is_file() and target.stat().st_size>1000:
              continue
            for attempt in range(1,5):
              try:
                downloaded=hf_hub_download(repo_id=repo,filename=name,
                    revision=revision)
                shutil.copy2(downloaded,target)
                break
              except Exception as exc:
                print('ORIGINAL_KOREAN_MODEL_HTTP_FETCH_ATTEMPT',
                      name,attempt,type(exc).__name__,str(exc)[:240],flush=True)
                if attempt==4:raise
                time.sleep(15*attempt)
          c=root/'config.json'; ck=root/'checkpoint.pth'
          assert 1000<c.stat().st_size<1000000,'INVALID_KR_TTS_CONFIG'
          assert 5000000<ck.stat().st_size<800000000,'INVALID_KR_TTS_CHECKPOINT'
          j=json.loads(c.read_text())
          assert 'KR' in j.get('data',{}).get('spk2id',{}),'NOT_THE_KOREAN_VOICE_MODEL'
          hashes=[]
          for item in (c,ck):
            digest=hashlib.sha256(item.read_bytes()).hexdigest()
            hashes.append(digest+'  '+item.name)
          (root/'model-sha256.txt').write_text('\n'.join(hashes)+'\n')
          print('ONE_ORIGINAL_KR_MODEL_HTTP_DOWNLOADED_AND_SHA256_RECORDED')
          PY
      - name: Share model once across four parallel original video render jobs
        uses: actions/upload-artifact@v4
        with:
          name: unboda-licensed-melotts-kr-model
          path: /tmp/unboda-kr-voice-model/
          if-no-files-found: error
          retention-days: 1

  render:
    needs: [preflight,voice-model]
    if: needs.preflight.result == 'success' && needs.preflight.outputs.skip_release != 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: midnight
            slot: '00'
            brief: episodes/003-midnight.json
          - name: commute
            slot: '08'
            brief: episodes/004-commute.json
          - name: friendship
            slot: '12'
            brief: episodes/005-friendship.json
          - name: afterwork
            slot: '20'
            brief: episodes/002-afterwork.json
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      UNBODA_BRIEF: ${{ matrix.brief }}
      UNBODA_OUTPUT: /tmp/unboda-ready-${{ matrix.name }}
      UNBODA_TTS_CONFIG_PATH: ${{ github.workspace }}/voice-asset/config.json
      UNBODA_TTS_CHECKPOINT_PATH: ${{ github.workspace }}/voice-asset/checkpoint.pth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/unboda-shaka-ffmpeg
          key: unboda-ffmpeg-shaka-n8.1.2-2-portable-x64-v2
      - name: FFmpeg and Korean fonts
        run: |
          set -euo pipefail
          # Shaka GPL FFmpeg+FFprobe generic x64 binaries, without Ubuntu24 VAAPI link requirements.
          # Exact release/tag and SHA256s checked before any media processing.
          bin="$RUNNER_TEMP/unboda-shaka-ffmpeg"
          mkdir -p "$bin"
          for item in \
            ffmpeg:9eac5b2b5076db5ff853a6fa0dcd6b8de7d0cac8481eadda6c47cd935825f1ee \
            ffprobe:065d3c56926052a76e884c4e4b51b7d95248da9391ab7effdcca6b94ceab98cf; do
            exe="$(printf '%s' "$item" | cut -d: -f1)"
            digest="$(printf '%s' "$item" | cut -d: -f2)"
            if test -s "$bin/$exe" && printf '%s  %s\n' "$digest" "$bin/$exe" | sha256sum -c -; then
              echo "SHARED_PINNED_FFMPEG_BINARY_CACHE_HIT:$exe"
            else
              curl --fail --silent --show-error --location --retry 2 --retry-delay 3 \
                --connect-timeout 15 --max-time 240 \
                "https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n8.1.2-2/$exe-linux-x64" \
                --output "$bin/$exe"
              printf '%s  %s\n' "$digest" "$bin/$exe" | sha256sum -c - || {
                echo "UNTRUSTED_FFMPEG_BINARY_CHECKSUM" >&2
                exit 1
              }
            fi
            chmod 0755 "$bin/$exe"
          done
          "$bin/ffmpeg" -hide_banner -encoders > "$bin/encoders.txt"
          grep -q 'libx264' "$bin/encoders.txt" || { echo "FFMPEG_H264_ENCODER_MISSING"; exit 1; }
          "$bin/ffprobe" -hide_banner -version >/dev/null
          echo "$bin" >> "$GITHUB_PATH"
          echo "PINNED_FFMPEG_FFPROBE_SHA256_VERIFIED"
          # Use exact upstream Noto CJK fonts verified by Git blob hash.
          # The font is used on ephemeral runners only; it is NOT a release asset.
          if test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc &&
             test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc; then
            echo "EXACT_KOREAN_CJK_FONTS_PRESENT"
          else
            tmp="$(mktemp -d)"
            rev="f8d157532fbfaeda587e826d4cd5b21a49186f7c"
            for item in \
              NotoSansCJK-Regular.ttc:a2033d0e4e53f568c3f418a7d5d8c951af3f76c1 \
              NotoSansCJK-Bold.ttc:ce48b99a84eb3300774353f1f15ce686e53b6734; do
              font="$(printf '%s' "$item" | cut -d: -f1)"
              digest="$(printf '%s' "$item" | cut -d: -f2)"
              curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --connect-timeout 10 --max-time 150 \
                "https://raw.githubusercontent.com/notofonts/noto-cjk/$rev/Sans/OTC/$font" \
                --output "$tmp/$font"
              test "$(git hash-object "$tmp/$font")" = "$digest" || {
                echo "PINNED_CJK_FONT_INTEGRITY_CHECK_FAILED:$font" >&2
                exit 1
              }
              sudo install -D -m 0644 "$tmp/$font" "/usr/share/fonts/opentype/noto/$font"
            done
            echo "PINNED_KOREAN_CJK_FONTS_VERIFIED_FROM_UPSTREAM"
          fi
          timeout 150s python -m pip install --no-cache-dir 'Pillow==11.3.0'
      - name: Check renderer before work
        run: |
          python -m unittest discover -s automation/social/lifestyle-pilot -p 'test_*.py' -v
      - name: Assert four distinct SAJU hero scenes are visibly animated at phone resolution
        run: |
          python -m unittest discover -s automation/social/lifestyle-pilot -p 'test_brand_visuals.py' -v
      - name: Draw original 30s moving scene and title cover
        run: |
          python automation/social/lifestyle-pilot/render.py \
            --brief automation/social/lifestyle-pilot/"$UNBODA_BRIEF" \
            --out "$UNBODA_OUTPUT"
      - name: Install free Korean speech synthesizer (fixed upstream revision)
        run: |
          # Short stalls should fail safely and let the immutable-release
          # scheduled backup retry, rather than consuming the only worker.
          timeout 540s python -m pip install --disable-pip-version-check --no-cache-dir 'git+https://github.com/myshell-ai/MeloTTS.git@209145371cff8fc3bd60d7be902ea69cbdb7965a'
          timeout 240s python -m unidic download
      - uses: actions/download-artifact@v4
        with:
          name: unboda-licensed-melotts-kr-model
          path: ./voice-asset
      - name: Verify trusted same Korean model files in each render
        run: |
          cd voice-asset
          sha256sum -c model-sha256.txt
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('.')
          c=json.loads((p/'config.json').read_text())
          assert 'KR' in c.get('data',{}).get('spk2id',{})
          assert (p/'checkpoint.pth').stat().st_size>5000000
          print('SAME_KOREAN_MODEL_VERIFIED_FOR_ORIGINAL_CLIP')
          PY
      - name: Generate Korean voice and merge 30s video
        run: |
          python automation/social/lifestyle-pilot/narrate.py \
            --brief automation/social/lifestyle-pilot/"$UNBODA_BRIEF" \
            --out "$UNBODA_OUTPUT"
      - name: Enforce visual, voice, thumbnail, codecs and video duration QA
        run: |
          node automation/social/pilot-preview/media-technical-qa.mjs \
            "$UNBODA_OUTPUT/LIFESTYLE_30S_KOREAN_PRIVATE_REVIEW.mp4" \
            "$UNBODA_OUTPUT/LIFESTYLE_COVER.jpg" \
            "$UNBODA_OUTPUT/LIFESTYLE_KOREAN_NARRATION.wav" \
            "$UNBODA_OUTPUT/LIFESTYLE_TECHNICAL_QA.json"
      - uses: actions/upload-artifact@v4
        with:
          name: unboda-next-day-${{ matrix.slot }}-${{ matrix.name }}
          path: |
            ${{ env.UNBODA_OUTPUT }}/LIFESTYLE_30S_KOREAN_PRIVATE_REVIEW.mp4
            ${{ env.UNBODA_OUTPUT }}/LIFESTYLE_COVER.jpg
            ${{ env.UNBODA_OUTPUT }}/VISUAL_PROOF.json
            ${{ env.UNBODA_OUTPUT }}/LIFESTYLE_TECHNICAL_QA.json
          if-no-files-found: error
          retention-days: 1
  archive:
    needs: [preflight,render]
    if: needs.preflight.result == 'success' && needs.render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATE: ${{ needs.preflight.outputs.target_date }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.preflight.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: unboda-next-day-*
          path: ./completed
          merge-multiple: false
      - name: Verify all four QA and create immutable asset manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const slots=[['00','midnight'],['08','commute'],['12','friendship'],['20','afterwork']];
          const manifest={schemaVersion:1,targetDateKst:process.env.DATE,
            generatedBy:'github-actions-four-qa-verified',publishAutomatically:false,
            brandSajuVerified:true,fourDistinctVisualStylesVerified:true,
            sourceCommit:process.env.SOURCE_COMMIT,videos:[]};
          import {inspectFourSajuBrandEpisodes} from './automation/social/lifestyle-pilot/brand-video-guard.mjs';
          const subjects=['003-midnight','004-commute','005-friendship','002-afterwork'];
          const reviewed=subjects.map(name=>JSON.parse(fs.readFileSync(
            'automation/social/lifestyle-pilot/episodes/'+name+'.json','utf8')));
          const brand=inspectFourSajuBrandEpisodes(reviewed);
          if(!brand.ok)throw Error('SAJU_OR_FOUR_VISUAL_IDENTITY_GATE_FAILED:'+brand.reason);
          fs.mkdirSync('release-assets',{recursive:true});
          let total=0;
          for(const [hour,name] of slots){
            const base='completed/unboda-next-day-'+hour+'-'+name+'/';
            const movie=fs.readFileSync(base+'LIFESTYLE_30S_KOREAN_PRIVATE_REVIEW.mp4');
            const cover=fs.readFileSync(base+'LIFESTYLE_COVER.jpg');
            const qa=JSON.parse(fs.readFileSync(base+'LIFESTYLE_TECHNICAL_QA.json','utf8'));
            const visualProof=JSON.parse(fs.readFileSync(base+'VISUAL_PROOF.json','utf8'));
            const sha=createHash('sha256').update(movie).digest('hex');
            if(qa.state!=='PASS_TECHNICAL_ONLY'||qa.technicalChecksPassed!==true||
              qa.video?.sha256!==sha||qa.video?.bytes!==movie.length||
              qa.cover?.sha256!==createHash('sha256').update(cover).digest('hex')||
              qa.publicationAllowed!==false||qa.reasons?.length!==0||
              movie.toString('ascii',4,8)!=='ftyp'||movie.length>45000000)
             throw Error('INVALID_VIDEO_QA:'+name);
            total+=movie.length;
            const file=hour+'-'+name+'.mp4',coverName=hour+'-'+name+'.jpg';
            fs.writeFileSync('release-assets/'+file,movie);
            fs.writeFileSync('release-assets/'+coverName,cover);
            const briefs={midnight:'003-midnight',commute:'004-commute',
              friendship:'005-friendship',afterwork:'002-afterwork'};
            const b=JSON.parse(fs.readFileSync('automation/social/lifestyle-pilot/episodes/'+briefs[name]+'.json','utf8'));
            // Verify the actual Python renderer drew the validated object in the
            // finished MP4 instead of accepting text-only storyboard declarations.
            if(visualProof.topicVisualMatchVerified!==true||
              visualProof.topicVisualMotif!==b.visualMotif||
              !visualProof.actualMotifGraphic||
              !visualProof.visibleTopicObject||
              visualProof.originalMovingGraphics!==true||
              !b.visualMotif)
             throw Error('ACTUAL_VIDEO_TOPIC_VISUAL_NOT_DRAWN:'+name);
            manifest.videos.push({hourKst:hour,name,mp4:file,jpg:coverName,
              visualMotif:b.visualMotif,topicVisualMatchVerified:true,
              sha256:sha,bytes:movie.length,topicKey:b.topicKey,
              title:b.thumbnailTitle,caption:b.narrationDraft.join(' '),
              editorialFormat:b.editorialFormat||'legacy_lifestyle',
              sajuCategory:b.sajuCategory,visualStyle:b.visualStyle,
              destination:b.destination,socialPublishingApproved:false});
          }
          if(total>6000000)throw Error('DAY_BYTES_CAP_EXCEEDED');
          fs.writeFileSync('release-assets/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('FOUR_REAL_MP4S_VERIFIED '+process.env.DATE+' totalBytes='+total);
          NODE
      - name: Prove unapproved media remains private
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('release-assets/manifest.json','utf8'));
          if(m.publishAutomatically!==false||!Array.isArray(m.videos)||m.videos.length!==4||
             m.videos.some(v=>v.socialPublishingApproved!==false))
            throw Error('MISSING_PRIVATE_REVIEW_POLICY');
          console.log('FOUR_VIDEOS_UNAPPROVED_PRIVATE_ONLY');
          NODE
      - name: Store review-only media in expiring private GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: unboda-private-review-${{ needs.preflight.outputs.target_date }}-NO-PUBLISH
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/unboda-shaka-ffmpeg
          key: unboda-ffmpeg-shaka-n8.1.2-2-portable-x64-v2
      - name: Install FFmpeg and independent Korean speech ASR
        run: |
          set -euo pipefail
          # Shaka GPL FFmpeg+FFprobe generic x64 binaries, without Ubuntu24 VAAPI link requirements.
          # Exact release/tag and SHA256s checked before any media processing.
          bin="$RUNNER_TEMP/unboda-shaka-ffmpeg"
          mkdir -p "$bin"
          for item in \
            ffmpeg:9eac5b2b5076db5ff853a6fa0dcd6b8de7d0cac8481eadda6c47cd935825f1ee \
            ffprobe:065d3c56926052a76e884c4e4b51b7d95248da9391ab7effdcca6b94ceab98cf; do
            exe="$(printf '%s' "$item" | cut -d: -f1)"
            digest="$(printf '%s' "$item" | cut -d: -f2)"
            if test -s "$bin/$exe" && printf '%s  %s\n' "$digest" "$bin/$exe" | sha256sum -c -; then
              echo "SHARED_PINNED_FFMPEG_BINARY_CACHE_HIT:$exe"
            else
              curl --fail --silent --show-error --location --retry 2 --retry-delay 3 \
                --connect-timeout 15 --max-time 240 \
                "https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n8.1.2-2/$exe-linux-x64" \
                --output "$bin/$exe"
              printf '%s  %s\n' "$digest" "$bin/$exe" | sha256sum -c - || {
                echo "UNTRUSTED_FFMPEG_BINARY_CHECKSUM" >&2
                exit 1
              }
            fi
            chmod 0755 "$bin/$exe"
          done
          "$bin/ffmpeg" -hide_banner -encoders > "$bin/encoders.txt"
          grep -q 'libx264' "$bin/encoders.txt" || { echo "FFMPEG_H264_ENCODER_MISSING"; exit 1; }
          "$bin/ffprobe" -hide_banner -version >/dev/null
          echo "$bin" >> "$GITHUB_PATH"
          echo "PINNED_FFMPEG_FFPROBE_SHA256_VERIFIED"
          timeout 270s python -m pip install --no-cache-dir 'faster-whisper==1.2.1'
      - name: Verify four unique rights-safe original MP4s and speech transcript similarity
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/social/lifestyle-pilot -p 'test_approve_daily_release.py' -v
          python automation/social/lifestyle-pilot/approve-daily-release.py
          python - <<'PY'
          import json
          m=json.load(open('release-assets/manifest.json'))
          assert m['publishAutomatically'] is False
          assert len(m['videos'])==4
          assert all(v['socialPublishingApproved'] is True and
             v['licenseReviewed'] is True and v['voiceAutomatedQaApproved'] is True and
             v['voiceHumanReviewed'] is False and
             v['voiceAsrSimilarity']>=0.82 for v in m['videos'])
          print('FOUR_ORIGINALS_EXPLICITLY_APPROVED_BY_ASR_NOT_HUMAN')
          PY
      - name: Host only the approved four original MP4s as durable read-only media
        run: |
          set -euo pipefail
          TAG="unboda-saju-shorts-$DATE"
          if gh release view "$TAG" --repo mannerjm/unboda >/dev/null 2>&1; then
            echo "RELEASE_EXISTS_NO_OVERWRITE_OR_DOUBLE_UPLOAD: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* --repo mannerjm/unboda \
            --target "${{ github.sha }}" \
            --title "운보다 신규 사주 영상 4편 $DATE (오디오·원본 QA 통과)" \
            --notes "Original procedural video/audio, MeloTTS MIT commercial licensed, independent Korean Whisper ASR and originality checks passed; voiceHumanReviewed=false; posting by separate verified Metricool worker." \
            --prerelease
          gh release view "$TAG" --repo mannerjm/unboda --json assets --jq '.assets|length' | grep -qx 10
          echo "UNBODA_FOUR_DAILY_VERIFIED_ORIGINALS_PUBLIC_MEDIA_READY"
