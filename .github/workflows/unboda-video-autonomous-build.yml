name: UNBODA 4 daily Korean shorts build and permanent media assets
# A small standalone main-branch workflow can run independently of the unmerged
# video-development PR; GitHub Actions sources are pinned to a single commit.
# It DOES NOT create Metricool posts or change any social publishing switch.
on:
  schedule:
    - cron: '13 8 * * *' # 17:13 KST, prepare the FOLLOWING day's four videos
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unboda-video-autonomous-build.yml'
permissions:
  contents: write
concurrency:
  group: unboda-daily-video-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'mannerjm/unboda' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      target_date: ${{ steps.check.outputs.target_date }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/social-automation-safety-poc-20261023
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: check
        env:
          TZ: Asia/Seoul
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          DATE="$(date -d tomorrow +%Y%m%d)"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "target_date=$DATE" >> "$GITHUB_OUTPUT"
          node --test automation/social/lifestyle-pilot/brand-video-guard.test.mjs
          node --test automation/social/lifestyle-pilot/four-daily-private-validator.test.mjs
          node automation/social/lifestyle-pilot/four-daily-private-validator.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=process.env.TZ?new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()):'';
          const tomorrow=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
          tomorrow.setDate(tomorrow.getDate()+1);
          const expected=[tomorrow.getFullYear(),String(tomorrow.getMonth()+1).padStart(2,'0'),
            String(tomorrow.getDate()).padStart(2,'0')].join('');
          const files=['003-midnight','004-commute','005-friendship','002-afterwork'];
          const seen=new Set();
          for(const file of files){
           const p='automation/social/lifestyle-pilot/episodes/'+file+'.json';
           const x=JSON.parse(fs.readFileSync(p,'utf8'));
           if(!x.topicKey?.endsWith(expected)||
              x.automatedPublicationAllowed!==false||seen.has(x.topicKey)||
              typeof x.narrationDraft?.[2]!=='string'||
              x.narrationDraft[2].replace(/\s/g,'').length<28||
              x.destination!=='https://unboda.kr'||
              !x.narrationDraft?.[3]?.includes('운보다 무료 사주 조회'))
             throw Error('NO_FRESH_NEXT_DAY_STORYBOARD:'+file);
           seen.add(x.topicKey);
          }
          console.log('NEXT_DAY_PRIVATE_SOURCE_VERIFIED '+expected+' topics='+seen.size);
          NODE
  render:
    needs: preflight
    if: needs.preflight.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: midnight
            slot: '00'
            brief: episodes/003-midnight.json
          - name: commute
            slot: '08'
            brief: episodes/004-commute.json
          - name: friendship
            slot: '12'
            brief: episodes/005-friendship.json
          - name: afterwork
            slot: '20'
            brief: episodes/002-afterwork.json
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      UNBODA_BRIEF: ${{ matrix.brief }}
      UNBODA_OUTPUT: /tmp/unboda-ready-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: FFmpeg and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fontconfig
          python -m pip install --no-cache-dir 'Pillow==11.3.0'
      - name: Check renderer before work
        run: |
          python -m unittest discover -s automation/social/lifestyle-pilot -p 'test_*.py' -v
      - name: Assert four distinct SAJU hero scenes are visibly animated at phone resolution
        run: |
          python -m unittest discover -s automation/social/lifestyle-pilot -p 'test_brand_visuals.py' -v
      - name: Draw original 30s moving scene and title cover
        run: |
          python automation/social/lifestyle-pilot/render.py \
            --brief automation/social/lifestyle-pilot/"$UNBODA_BRIEF" \
            --out "$UNBODA_OUTPUT"
      - name: Install free Korean speech synthesizer (fixed upstream revision)
        run: |
          python -m pip install --no-cache-dir 'git+https://github.com/myshell-ai/MeloTTS.git@209145371cff8fc3bd60d7be902ea69cbdb7965a'
          python -m unidic download
      - name: Generate Korean voice and merge 30s video
        run: |
          python automation/social/lifestyle-pilot/narrate.py \
            --brief automation/social/lifestyle-pilot/"$UNBODA_BRIEF" \
            --out "$UNBODA_OUTPUT"
      - name: Enforce visual, voice, thumbnail, codecs and video duration QA
        run: |
          node automation/social/pilot-preview/media-technical-qa.mjs \
            "$UNBODA_OUTPUT/LIFESTYLE_30S_KOREAN_PRIVATE_REVIEW.mp4" \
            "$UNBODA_OUTPUT/LIFESTYLE_COVER.jpg" \
            "$UNBODA_OUTPUT/LIFESTYLE_KOREAN_NARRATION.wav" \
            "$UNBODA_OUTPUT/LIFESTYLE_TECHNICAL_QA.json"
      - uses: actions/upload-artifact@v4
        with:
          name: unboda-next-day-${{ matrix.slot }}-${{ matrix.name }}
          path: |
            ${{ env.UNBODA_OUTPUT }}/LIFESTYLE_30S_KOREAN_PRIVATE_REVIEW.mp4
            ${{ env.UNBODA_OUTPUT }}/LIFESTYLE_COVER.jpg
            ${{ env.UNBODA_OUTPUT }}/LIFESTYLE_TECHNICAL_QA.json
          if-no-files-found: error
          retention-days: 1
  archive:
    needs: [preflight,render]
    if: needs.preflight.result == 'success' && needs.render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATE: ${{ needs.preflight.outputs.target_date }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.preflight.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: unboda-next-day-*
          path: ./completed
          merge-multiple: false
      - name: Verify all four QA and create immutable asset manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const slots=[['00','midnight'],['08','commute'],['12','friendship'],['20','afterwork']];
          const manifest={schemaVersion:1,targetDateKst:process.env.DATE,
            generatedBy:'github-actions-four-qa-verified',publishAutomatically:false,
            brandSajuVerified:true,fourDistinctVisualStylesVerified:true,
            sourceCommit:process.env.SOURCE_COMMIT,videos:[]};
          import {inspectFourSajuBrandEpisodes} from './automation/social/lifestyle-pilot/brand-video-guard.mjs';
          const subjects=['003-midnight','004-commute','005-friendship','002-afterwork'];
          const reviewed=subjects.map(name=>JSON.parse(fs.readFileSync(
            'automation/social/lifestyle-pilot/episodes/'+name+'.json','utf8')));
          const brand=inspectFourSajuBrandEpisodes(reviewed);
          if(!brand.ok)throw Error('SAJU_OR_FOUR_VISUAL_IDENTITY_GATE_FAILED:'+brand.reason);
          fs.mkdirSync('release-assets',{recursive:true});
          let total=0;
          for(const [hour,name] of slots){
            const base='completed/unboda-next-day-'+hour+'-'+name+'/';
            const movie=fs.readFileSync(base+'LIFESTYLE_30S_KOREAN_PRIVATE_REVIEW.mp4');
            const cover=fs.readFileSync(base+'LIFESTYLE_COVER.jpg');
            const qa=JSON.parse(fs.readFileSync(base+'LIFESTYLE_TECHNICAL_QA.json','utf8'));
            const sha=createHash('sha256').update(movie).digest('hex');
            if(qa.state!=='PASS_TECHNICAL_ONLY'||qa.technicalChecksPassed!==true||
              qa.video?.sha256!==sha||qa.video?.bytes!==movie.length||
              qa.cover?.sha256!==createHash('sha256').update(cover).digest('hex')||
              qa.publicationAllowed!==false||qa.reasons?.length!==0||
              movie.toString('ascii',4,8)!=='ftyp'||movie.length>45000000)
             throw Error('INVALID_VIDEO_QA:'+name);
            total+=movie.length;
            const file=hour+'-'+name+'.mp4',coverName=hour+'-'+name+'.jpg';
            fs.writeFileSync('release-assets/'+file,movie);
            fs.writeFileSync('release-assets/'+coverName,cover);
            const briefs={midnight:'003-midnight',commute:'004-commute',
              friendship:'005-friendship',afterwork:'002-afterwork'};
            const b=JSON.parse(fs.readFileSync('automation/social/lifestyle-pilot/episodes/'+briefs[name]+'.json','utf8'));
            manifest.videos.push({hourKst:hour,name,mp4:file,jpg:coverName,
              sha256:sha,bytes:movie.length,topicKey:b.topicKey,
              title:b.thumbnailTitle,caption:b.narrationDraft.join(' '),
              sajuCategory:b.sajuCategory,visualStyle:b.visualStyle,
              destination:b.destination,socialPublishingApproved:false});
          }
          if(total>6000000)throw Error('DAY_BYTES_CAP_EXCEEDED');
          fs.writeFileSync('release-assets/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('FOUR_REAL_MP4S_VERIFIED '+process.env.DATE+' totalBytes='+total);
          NODE
      - name: Prove unapproved media remains private
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('release-assets/manifest.json','utf8'));
          if(m.publishAutomatically!==false||!Array.isArray(m.videos)||m.videos.length!==4||
             m.videos.some(v=>v.socialPublishingApproved!==false))
            throw Error('MISSING_PRIVATE_REVIEW_POLICY');
          console.log('FOUR_VIDEOS_UNAPPROVED_PRIVATE_ONLY');
          NODE
      - name: Store review-only media in expiring private GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: unboda-private-review-${{ needs.preflight.outputs.target_date }}-NO-PUBLISH
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
      - name: Verify unapproved media is not in a public GitHub release
        run: |
          set -euo pipefail
          TAG="unboda-saju-shorts-$DATE"
          if gh release view "$TAG" --repo mannerjm/unboda >/dev/null 2>&1; then
            echo "UNEXPECTED_UNAPPROVED_PUBLIC_RELEASE: $TAG" >&2
            exit 1
          fi
          echo "PRIVATE_ONLY_NO_AUTOMATIC_SOCIAL_POST"
