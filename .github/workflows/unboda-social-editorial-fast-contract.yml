name: UNBODA social observed-post originality fast contract (NO PUBLISH)
on:
  pull_request:
    paths:
      - 'automation/social/lifestyle-autogenerator.mjs'
      - 'automation/social/lifestyle-autogenerator.test.mjs'
      - 'automation/social/lifestyle-staging-orchestrator.mjs'
      - 'automation/social/lifestyle-staging-orchestrator.test.mjs'
      - 'automation/social/observed-public-novelty.mjs'
      - 'automation/social/observed-public-novelty.test.mjs'
      - 'automation/social/four-kst-video-slots.mjs'
      - 'automation/social/four-kst-video-slots.test.mjs'
      - 'automation/social/private-review-storage.mjs'
      - 'automation/social/private-review-storage.test.mjs'
      - 'automation/social/supabase-private-adapter.mjs'
      - 'automation/social/supabase-private-adapter.test.mjs'
      - 'automation/social/openai-lifestyle-generator.mjs'
      - 'automation/social/openai-lifestyle-generator.test.mjs'
      - 'automation/social/lifestyle-pilot/compile-ai-private-brief.mjs'
      - 'automation/social/lifestyle-pilot/compile-ai-private-brief.test.mjs'
      - 'automation/social/archive-private-media-and-receipt.mjs'
      - 'automation/social/archive-private-media-and-receipt.test.mjs'
      - 'automation/social/verify-video-publication-evidence.mjs'
      - 'automation/social/verify-video-publication-evidence.test.mjs'
      - 'automation/social/staging-observed-post-raw-sha256-compat.sql'
      - 'automation/social/staging-remote-post-integrity-guard.sql'
      - 'automation/social/staging-private-media-archive-ledger.sql'
      - 'automation/social/cloud-worker/vercel.json'
      - 'automation/social/lifestyle-pilot/four-daily-private-validator.mjs'
      - 'automation/social/lifestyle-pilot/four-daily-private-validator.test.mjs'
      - 'automation/social/lifestyle-pilot/four-daily-private-manifest.json'
      - '.github/workflows/unboda-social-editorial-fast-contract.yml'
concurrency:
  group: unboda-fast-social-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-originality-contract:
    if: github.repository == 'mannerjm/unboda' && github.event.pull_request.head.repo.full_name == 'mannerjm/unboda'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no remote history omissions bypass 90-day duplicate locks
        run: |
          node --test \
            automation/social/lifestyle-autogenerator.test.mjs \
            automation/social/lifestyle-staging-orchestrator.test.mjs \
            automation/social/observed-public-novelty.test.mjs \
            automation/social/four-kst-video-slots.test.mjs \
            automation/social/lifestyle-pilot/four-daily-private-validator.test.mjs \
            automation/social/private-review-storage.test.mjs \
            automation/social/supabase-private-adapter.test.mjs \
            automation/social/openai-lifestyle-generator.test.mjs \
            automation/social/lifestyle-pilot/compile-ai-private-brief.test.mjs \
            automation/social/archive-private-media-and-receipt.test.mjs \
            automation/social/verify-video-publication-evidence.test.mjs
