name: 운보다 외부 독립 장애 감시

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unboda-external-uptime.yml
      - scripts/ops-external-uptime.py

permissions:
  contents: read
  issues: write

concurrency:
  group: unboda-external-uptime
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout monitored code
        uses: actions/checkout@v4
      - name: Confirm uptime and manage incident
        run: python3 scripts/ops-external-uptime.py
