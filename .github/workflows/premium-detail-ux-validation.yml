name: Premium Detail UX Validation

on:
  push:
    branches:
      - ux/simplify-premium-detail

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate concise premium detail
        run: |
          npx tsx scripts/premium-product-detail-convergence-regression.ts
          npx tsx scripts/premium-presentation-regression.ts
          npx tsx scripts/paid-analysis-v4-topic-config-regression.ts
          npm run build
