name: One-time isolated dependency lock refresh
on:
  push:
    branches:
      - test/security-dependency-patch-20261024
    paths:
      - .github/workflows/security-dependency-refresh-20261024.yml

permissions:
  contents: write

jobs:
  refresh-lock-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare patched lock without package lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --save-exact next@16.4.1 sharp@0.35.5
      - name: Update compatible vulnerable transitive dependencies
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Validate lock consistency
        run: npm ci --ignore-scripts --no-audit
      - name: Enforce critical/high production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Reject unrelated modifications
        run: |
          test "$(git diff --name-only | sort)" = "$(printf 'package-lock.json\npackage.json')"
      - name: Commit only patched manifests to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git commit -m "fix(security): upgrade vulnerable Next.js and sharp lock entries"
          git push origin HEAD:test/security-dependency-patch-20261024
