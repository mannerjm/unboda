name: UNBODA next-day 18-slot source and SNS reservation early warning (READ ONLY)
# This workflow NEVER POSTs to Metricool or changes any existing automation.
on:
  # Paused scheduled lifestyle content/photo workflows per user request 2026-11-10.
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/social/verify-nextday-18-live-readiness.py'
      - '.github/workflows/unboda-nextday-18-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/social/verify-nextday-18-live-readiness.py'
      - '.github/workflows/unboda-nextday-18-readiness.yml'
permissions:
  contents: read
concurrency:
  group: unboda-readonly-nextday-18-prepublish
  cancel-in-progress: false
jobs:
  offline-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove 18-slot ledger has no network POST, no wrong-day success
        run: |
          set -euo pipefail
          python -m py_compile scripts/social/verify-nextday-18-live-readiness.py
          python scripts/social/verify-nextday-18-live-readiness.py --self-test
  live-readonly-inspection:
    if: >
      github.repository == 'mannerjm/unboda' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    needs: offline-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      # The secret is OPTIONAL for a safe source-only inspection, but actual
      # booking proof is IMPOSSIBLE without a configured protected token.
      METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read tomorrow GitHub releases and exact Metricool statuses (zero writes)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/social/verify-nextday-18-live-readiness.py --out /tmp/unboda-18-readiness.json
      - name: Preserve redacted immutable metadata-only discrepancy report even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unboda-nextday-18-readonly-status
          path: /tmp/unboda-18-readiness.json
          retention-days: 7
          if-no-files-found: warn
